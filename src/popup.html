<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enhanced 23mofang · 设置</title>
  <style>
    body{width:310px;margin:0;padding:20px;font:14px/1.6 system-ui,sans-serif;background:#f7fafb;color:#183e50}
    h1{font-size:18px;margin:0 0 16px}label{display:flex;align-items:center;gap:16px;padding:14px;background:white;border:1px solid #dbe5e9;border-radius:10px;margin:10px 0;cursor:pointer}
    .copy{flex:1}strong{display:block;font-size:15px}small{display:block;color:#617581;font-size:12px;margin-top:4px}
    input{appearance:none;flex:none;width:40px;height:24px;background:#87949c;border-radius:20px;position:relative;cursor:pointer;margin:0}
    input:before{content:'';position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:white;transition:transform .15s}
    input:checked{background:#237b8e}input:checked:before{transform:translateX(16px)}input:focus-visible{outline:3px solid #60a4d9;outline-offset:3px}input:disabled{opacity:.5;cursor:wait}
    p{font-size:12px;color:#617581;margin:14px 0 0;min-height:38px}
  </style>
</head>
<body>
  <h1>Enhanced 23mofang · 功能开关</h1>
  <label for="samples"><span class="copy"><strong>样本查询</strong><small>古DNA、科研、多源样本及SNP查询</small></span><input id="samples" type="checkbox" role="switch" disabled></label>
  <label for="map"><span class="copy"><strong>区域地图扩展</strong><small>全国区县、市级地图；关闭后使用原站地图</small></span><input id="map" type="checkbox" role="switch" disabled></label>
  <p id="status" role="status">设置自动保存。修改后请刷新23魔方网页生效。</p>
  <script src="popup.js"></script>
</body>
</html>
